<!DOCTYPE>
<html>
<head>
    <html langue "universelle">
     <meta charset "UTF-8>
	 <meta name="viewport" content="width=device-width,initial-scale=1.0">
         <title>FORMULAIRE D'INSCRIPTION</title>
</head>
<body>
      <h1><b>FORMULAIRE D'INSCRIPTION</b></h1><br><br>
      <Form>
	     <label for="date">Choisir une date:</label>
         <input type="date" id="date" name="date" max="Aujourd'hui-limite"/> <br><br>
         <label for="Nom">*Nom: </label>		 
		 <input type="name" name*="Nom" id*="Nom" placeholder="Ecrire votre Nom ici" required/><br><br>
          <label for="Prénom">*Prénom: </label>		 
		  <input type="first name" name*="Prénom" id*="Prénom" placeholder="Ecrire votre Prénom ici" required/><br><br>
		 <label for="Sexe">Sexe:</label>		 
		 <input type="radio" name="Sexe" value="Masculin">
		 <label for="Masculin">Masculin</label>
		 <input type="radio" name="Sexe" value="Feminin">
		 <label for="Féminin">Féminin</label><br><br>
		 <label for="Adresse">*Adresse: </label>		 
		 <input type="Adress" name*="Adresse" id*="Adresse" placeholder="Ecrire votre adresse ici" required/><br><br>
         <label for="Téléphone">*Téléphone: </label>		 
		 <input type="phone" name*="Téléphone" id*="Téléphone" placeholder="Ecrire votre numero de telephone ici" required/><br><br>
	      <label for="Courier Electronique">Courier Electronique: </label>	 
		 <input type="e-mail" name="Courier Electronique" placeholder="Ecrire votre E-mail ici"><br><br>
	     <label for="date de naissance">*Date de naissance: </label>		 
		 <input type="date" name*="date" id*="date de naissance" required/><br><br>
	     <label for="Lieu de naissance">Lieu de naissance: </label>		 
		 <input type="City" name="Lieu de naissance" placeholder="Ecrire votre date de naissance"><br><br>
		 <select name="liste deroulente">
		 <option value="Faculté de Doits & des Sciences Economiques">Faculté de Doits & des Sciences Economiques</option>
		 <option value="Faculté d'Ethnolgie">Faculté d'Ethnolgie</option>
		 <option value="Faculté de Médecine & Famacolgie">Faculté de Médecine & Famacolgie</option>
		 <option value="Faculté Science Humaine">Faculté Science Humaine</option>
		 </select><br>
		 <textarea id="msg name="user_message></textarea><br>
		 <label for="msg">Message:</label><br>
	     <button type"submit">Envoyer</button>
	     <button type"submit">Reinitialiser</button>
		 
	  </Form>
